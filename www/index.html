<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolase Foto & Laporan 5s</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
        <div id="screenMenu" class="screen active">
            <h2>Pilih Metode Progress</h2>
            <div class="menu-box">
                <button class="menu-btn btn-kolase" onclick="switchScreen('screenKolase')">
                    Kolase Foto (Maks 40 Foto)
                </button>
                <button class="menu-btn btn-5s" onclick="switchScreen('screen5S')">
                    Progress 5S (Sebelum / Sesudah)
                </button>
            </div>
        </div>

        <div id="screenKolase" class="screen">
            <button class="back-btn" onclick="switchScreen('screenMenu')">⬅ Kembali ke Menu</button>
            <h3>Kolase Foto (1x1)</h3>
            
            <div class="input-group">
                <label for="inputKolase">Pilih Foto dari Galeri (Maksimal 40):</label>
                <input type="file" id="inputKolase" accept="image/*" multiple>
                <p id="statusFoto" style="font-weight: bold; color: #007bff; margin-top: 8px;">Total Terisi: 0 / 40 Foto</p>
                <p class="info-text">Susunan grid paten 5x8.</p>
                <!-- Input file tersembunyi -->
<input type="file" id="inputGantiFoto" accept="image/*" style="display:none;">

<!-- Bar Melayang Lengkap -->
<div id="quickToolbar" class="quick-toolbar" style="display: none;">
  <button type="button" id="btnQuickGanti" class="btn-tool">Ganti</button>
  <button type="button" id="btnQuickTukar" class="btn-tool" style="background: #f39c12;">Tukar</button>
  <button type="button" id="btnQuickHapus" class="btn-tool btn-danger-tool">Hapus</button>
  <button type="button" id="btnQuickTutup" class="btn-tool btn-close-tool">✕</button>
</div>
            </div>

            <div class="canvas-area">
                <canvas id="canvasKolase"></canvas>
            </div>

            <button class="action-btn" onclick="downloadCanvas('canvasKolase', 'kolase-matriks')">Simpan Hasil Gambar</button>
        </div>

        <div id="screen5S" class="screen">
  <button type="button" class="back-btn" onclick="switchScreen('screenMenu')">← Kembali ke Menu</button>
  
  <h2 style="text-align: center; margin: 15px 0;">Kolase 5S (Before & After)</h2>

  <!-- Card Upload Foto -->
  <div class="card">
    <label class="btn-file">
      Pilih 2 Foto Sekaligus (Before & After)
      <input type="file" id="inputFoto5S" accept="image/*" multiple>
    </label>
    <p id="fileStatus5S" class="status-text">Belum ada foto yang dipilih</p>
  </div>

  <!-- Card Input Lokasi + Tombol Library -->
  <div class="card">
    <label for="inputLokasi5S">Keterangan Lokasi:</label>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="inputLokasi5S" placeholder="Contoh: G1S-051" autocomplete="off" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
      <button type="button" id="btnPilihLokasi5S" class="btn-secondary" style="white-space: nowrap; padding: 0 14px; background: #e67e22; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
        📍 Pilih Lokasi
      </button>
    </div>
  </div>

  <!-- Preview Canvas -->
  <div class="preview-area" style="margin: 12px 0; background: #222; border-radius: 8px; padding: 4px;">
    <canvas id="canvas5S" style="width: 100%; height: auto; display: block; border-radius: 4px; touch-action: none;"></canvas>
  </div>

  <!-- Tombol Simpan -->
  <button type="button" id="btnSimpan5S" class="btn-primary" style="width: 100%; padding: 14px; background-color: #0066cc; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer;">
    Simpan ke Galeri
  </button>
</div>
    </div>

    <div id="modal-lokasi" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; padding: 15px;">
        <div style="background: white; width: 100%; max-width: 450px; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                <h4 style="margin: 0; color: #2c3e50;">Library Lokasi Logisteed</h4>
                <button onclick="tutupModalLokasi()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: #95a5a6;">&times;</button>
            </div>
            <div style="display: flex; gap: 8px; margin-bottom: 15px; justify-content: center;">
                <button type="button" onclick="tampilkanG(1)" style="background: #3498db; color: white; border: none; padding: 8px 16px; font-weight: bold; border-radius: 6px; cursor: pointer;">G1</button>
                <button type="button" onclick="tampilkanG(2)" style="background: #2ecc71; color: white; border: none; padding: 8px 16px; font-weight: bold; border-radius: 6px; cursor: pointer;">G2</button>
                <button type="button" onclick="tampilkanG(3)" style="background: #9b59b6; color: white; border: none; padding: 8px 16px; font-weight: bold; border-radius: 6px; cursor: pointer;">G3</button>
            </div>
            <div id="konten-lokasi" style="flex: 1; min-height: 200px; max-height: 50vh; overflow-y: auto;">
                <p style="text-align: center; color: #7f8c8d; margin-top: 50px;">Pilih kategori G1/G2/G3 di atas...</p>
            </div>
        </div>
    </div>

    <script src="js/library-lokasi.js"></script>
    <script src="js/engine-kolase.js"></script>
    <script src="js/engine-5s.js"></script>
    <script src="app.js"></script>
</body>
</html>
